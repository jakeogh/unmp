[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unmp"
version = "1!0.0.1787109860"
description = "iterates over or removes messagepacking from stdin"
authors = [
    { name = "Justin Keogh", email = "github.com@v6y.net" },
]

dependencies = [
    "eprint @ git+https://github.com/jakeogh/eprint@6ee1deca0c24b684eb5093247d6bd22e11f1b057",
]
license = "ISC"
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/jakeogh/unmp"

[project.scripts]
unmp = "unmp.cli:cli"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
unmp = [
    "py.typed",
]

